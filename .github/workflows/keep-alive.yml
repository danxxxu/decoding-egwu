name: Neo4j Aura Keep-Alive

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch: 

jobs:
  ping-db:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Aura via Vercel API
        run: |
          # Point this exactly to your API file path
          curl -f -L https://decoding-egwu.vercel.app/api/keep-alive